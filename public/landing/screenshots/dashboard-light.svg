<svg width="1400" height="800" viewBox="0 0 1400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="800" fill="#FFFFFF"/>

  <!-- Header -->
  <rect width="1400" height="60" fill="#F9FAFB"/>
  <text x="30" y="38" font-family="system-ui" font-size="18" font-weight="600" fill="#111827">ZuckZapGo Manager</text>
  <circle cx="1340" cy="30" r="15" fill="#E5E7EB"/>
  <text x="1280" y="38" font-family="system-ui" font-size="14" fill="#6B7280">admin</text>

  <!-- Stats Cards -->
  <rect x="30" y="100" width="320" height="140" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="50" y="130" font-family="system-ui" font-size="14" fill="#6B7280">Total de Instâncias</text>
  <text x="50" y="170" font-family="system-ui" font-size="48" font-weight="700" fill="#111827">3</text>
  <text x="50" y="200" font-family="system-ui" font-size="12" fill="#9CA3AF">Instâncias cadastradas</text>

  <rect x="370" y="100" width="320" height="140" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="390" y="130" font-family="system-ui" font-size="14" fill="#6B7280">Conectadas</text>
  <text x="390" y="170" font-family="system-ui" font-size="48" font-weight="700" fill="#10B981">2</text>
  <text x="390" y="200" font-family="system-ui" font-size="12" fill="#9CA3AF">Instâncias online</text>

  <rect x="710" y="100" width="320" height="140" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="730" y="130" font-family="system-ui" font-size="14" fill="#6B7280">Desconectadas</text>
  <text x="730" y="170" font-family="system-ui" font-size="48" font-weight="700" fill="#EF4444">1</text>
  <text x="730" y="200" font-family="system-ui" font-size="12" fill="#9CA3AF">Instâncias offline</text>

  <rect x="1050" y="100" width="320" height="140" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="1070" y="130" font-family="system-ui" font-size="14" fill="#6B7280">Taxa de Conexão</text>
  <text x="1070" y="170" font-family="system-ui" font-size="48" font-weight="700" fill="#3B82F6">67%</text>
  <text x="1070" y="200" font-family="system-ui" font-size="12" fill="#9CA3AF">Disponibilidade geral</text>

  <!-- Actions Section -->
  <text x="30" y="290" font-family="system-ui" font-size="18" font-weight="600" fill="#111827">⚡ Ações Rápidas</text>

  <!-- Action Cards Grid -->
  <rect x="30" y="310" width="320" height="80" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <text x="160" y="355" font-family="system-ui" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">Nova Instância</text>

  <rect x="370" y="310" width="320" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="530" y="355" font-family="system-ui" font-size="14" font-weight="500" fill="#111827" text-anchor="middle">Ver Instâncias</text>

  <rect x="710" y="310" width="320" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="870" y="355" font-family="system-ui" font-size="14" font-weight="500" fill="#111827" text-anchor="middle">Monitorar Eventos</text>

  <!-- API Status -->
  <rect x="30" y="430" width="640" height="120" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="60" cy="465" r="8" fill="#10B981"/>
  <text x="80" y="470" font-family="system-ui" font-size="16" font-weight="600" fill="#111827">API Conectada</text>
  <text x="80" y="490" font-family="system-ui" font-size="13" fill="#6B7280">Monitoramento em tempo real do backend ZuckZapGo</text>
  <rect x="80" y="505" width="60" height="24" rx="4" fill="#F3F4F6"/>
  <text x="110" y="522" font-family="system-ui" font-size="12" fill="#111827" text-anchor="middle">v1.2.6</text>

  <!-- Signature Badge -->
  <rect x="30" y="590" width="640" height="120" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="80" y="630" font-family="system-ui" font-size="16" font-weight="600" fill="#111827">Informações da Assinatura</text>
  <text x="80" y="650" font-family="system-ui" font-size="13" fill="#6B7280">Detalhes completos da sua licença ZuckZapGo</text>
  <rect x="80" y="665" width="70" height="24" rx="4" fill="#F3F4F6"/>
  <text x="115" y="682" font-family="system-ui" font-size="12" fill="#111827" text-anchor="middle">custom</text>
</svg>
